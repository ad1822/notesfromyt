<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Notes Capture</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      padding: 12px;
      width: 260px;
    }
    button {
      background: #222;
      border: 1px solid #555;
      padding: 8px 10px;
      color: #eee;
      cursor: pointer;
      width: 100%;
      border-radius: 6px;
    }
    button:hover {
      background: #333;
    }
    #info {
      margin-top: 10px;
      font-size: 13px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <button id="capture">Capture Screenshot + Info</button>
  <div id="info"></div>
  <textarea rows="4" cols="30" id="textarea"></textarea>
  <button id="save">Save</button>
  <script src="popup.js"></script>
</body>
</html>
