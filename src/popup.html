<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Notes Capture</title>
  <style>
    body {
      width: 320px;
      padding: 15px;
      background: #11111b;
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Textarea Styling */
    #textarea {
      width: 100%;
      min-height: 380px;
      padding: 10px;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background: #181825;
      color: #ffffff;
      resize: vertical;
      font-size: 14px;
      box-sizing: border-box;
    }

    /* Button Row */
    .button-group {
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      align-items: center;
    }

    /* Icon Buttons — Backgroundless */
    .icon-btn {
      all: unset;
      cursor: pointer;
      color: #cba6f7;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      transition: color 0.15s ease, transform 0.1s ease;
    }

    .icon-btn:hover {
      color: #fff;
      transform: scale(1.1);
    }

    .icon-btn:active {
      transform: scale(0.95);
      color: #3ea6ff;
    }

    /* Save button — primary action */
    #save {
      background-color: #89b4fa;
      color: #11111b;
      font-weight: 600;
      height: 38px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease;
    }

    #save:hover {
      background-color: #2b77c2;
    }

    /* Tooltip styling */
    .icon-btn[title] {
      position: relative;
    }

    .icon-btn[title]:hover::after {
      content: attr(title);
      position: absolute;
      bottom: -26px;
      background: #222;
      color: #ccc;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="button-group">
    <button id="metadata" class="icon-btn" title="Fetch Info">󰙎</button>
    <button id="capture" class="icon-btn" title="Capture Frame">󰹑</button>
    <button id="timestamp" class="icon-btn" title="Insert Timestamp"></button>
    <button id="clean" class="icon-btn" title="Clear Notes"></button>
    <button id="transcript" class="icon-btn" title="Get transcript"></button>
    <button id="open-settings" class="icon-btn" title="Setttings"></button>
  </div>

  <textarea id="textarea" placeholder="Start typing your notes here..."></textarea>

  <div class="button-group">
    <button id="h1" class="icon-btn" title="Heading 1">󰉫</button>
    <button id="h2" class="icon-btn" title="Heading 2">󰉬</button>
    <button id="h3" class="icon-btn" title="Heading 3">󰉭</button>
    <button id="bold" class="icon-btn" title="Bold the select text"></button>
    <button id="italic" class="icon-btn" title="Italic text"></button>
    <button id="underline" class="icon-btn" title="Underline"></button>
    <button id="bullets" class="icon-btn" title="Add bullet points">󰉺</button>
    <button id="checkbox" class="icon-btn" title="Checkbox"></button>
  </div>

  <button id="save"> Save Notes (.md)</button>

  <script src="popup.js"></script>
</body>
</html>
