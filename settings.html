<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YT Summarizer Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; width: 300px; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 6px; margin-top: 4px; }
    button { margin-top: 15px; padding: 8px; width: 100%; }
  </style>
</head>
<body>
  <h2>Settings</h2>

  <label>Gemini API Key</label>
  <input id="geminiKey" type="text" placeholder="Enter Gemini key">

  <label>YouTube API Key</label>
  <input id="youtubeKey" type="text" placeholder="Enter YouTube key">

  <button id="save">Save Settings</button>

  <script src="settings.js"></script>
</body>
</html>
